# cargo deny check: run in CI on every push and weekly.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. Add a crate-specific exception (with a reason) rather than widening this.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
